<!doctype html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <meta name="description" content="Описание страницы" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Регистрация - TheAntium</title>

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
            rel="stylesheet"
        />

        <link rel="stylesheet" type="text/css" href="/assets/css/reset.css" />
        <link rel="stylesheet" type="text/css" href="/assets/css/style2.css" />
        <link rel="icon" href="/assets/img/TheAntium_Logo3.png" />
        <script type="text/javascript" src="/assets/js/auth.js"></script>
    </head>
    <body>
        <header></header>
        <main>
            <section id="login-windows">
                <div class="login_logo">Anti</div>
                <div class="login-windows_input-wrapper">
                    <input
                        id="register_login"
                        type="text"
                        placeholder="Логин"
                    />
                </div>
                <div class="login-windows_input-wrapper">
                    <input
                        id="register_name"
                        type="text"
                        placeholder="Никнейм"
                    />
                </div>
                <div class="login-windows_input-wrapper">
                    <input
                        id="register_password"
                        type="text"
                        placeholder="Пароль"
                    />
                </div>
                <div class="login-windows_button-container">
                    <button
                        class="button primary"
                        id="register_button"
                        type="button"
                        onclick="register()"
                    >
                        Регистрация
                    </button>
                </div>
                <a href="/login" class="a havnt-account">Уже есть аккаунт?</a>
            </section>
        </main>
    </body>
</html>
