<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News</title>
    <link rel="stylesheet" type="text/css" href="news.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #333;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Static background overlay */
        .static-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(0deg, #011023 0%, #5381b2 100%);
            z-index: -1;
            pointer-events: none;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            position: relative;
        }

        h1 {
            font-size: 10.5rem;
            background: linear-gradient(0deg, #011023 10%, #5381b2 50%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            font-size: 1.1rem;
            color: #666;
            margin-bottom: 20px;
        }

        .post {
            padding: 25px;
            margin-bottom: 25px;
            backdrop-filter: blur(10px);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .avatar {
            width: 93px;
            height: 93px;
            border-radius: 20%;
            background: #c2e8ff;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #5482B3;
            font-weight: bold;
            font-size: 3.2rem;
            float: left;
            margin-right: 20px;
            margin-bottom: 20px;
        }

        .post-header {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }

        .user-info h3 {
            margin-top: 10px;
            color: white;
            font-size: 3.3rem;
            margin-bottom: 20px;
        }
        .post-content {
            color: white;
            font-size: 55px;
            line-height: 100%;
            margin-bottom: 20px;
        }

        .post-info {
            color: white;
            font-size: 25px;
            line-height: 100%;
            margin-bottom: 20px;
        }

        .post-image {
            height: 200px;
            width: 600px;
            background: linear-gradient(180deg, #011023 0%, #5381b2 100%);
            border-radius: 10px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .post-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .post-actions button {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.2rem;
            margin-right: 15px;
            transition: transform 0.2s ease;
        }

        .post-actions button:hover {
            transform: scale(1.2);
        }

        .post-stats {
            color: #666;
            font-size: 0.9rem;
        }

        .load-more {
            display: block;
            margin: 30px auto;
            padding: 15px 30px;
            background: rgba(255, 255, 255, 0.9);
            border: none;
            border-radius: 25px;
            font-size: 1.1rem;
            cursor: pointer;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .load-more:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
        }

        /* Add some decorative elements */
        .decorative-element {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            z-index: -1;
        }

        /* Responsive design */

        @media (max-width: 480px) {
            h1 {
                font-size: 1.5rem;
            }
            
            .post-content {
                font-size: 1rem;
            }
            
            .load-more {
                padding: 12px 24px;
                font-size: 1rem;
            }
        }

        /* Animation for posts */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .post {
            animation: fadeInUp 0.6s ease forwards;
        }

        /* Staggered animation for posts */
        .post:nth-child(1) { animation-delay: 0.1s; }
        .post:nth-child(2) { animation-delay: 0.2s; }
        .post:nth-child(3) { animation-delay: 0.3s; }
        .post:nth-child(4) { animation-delay: 0.4s; }
        .post:nth-child(5) { animation-delay: 0.5s; }
        .post:nth-child(6) { animation-delay: 0.6s; }
        .post:nth-child(7) { animation-delay: 0.7s; }
        .post:nth-child(8) { animation-delay: 0.8s; }
    </style>
</head>
<body>
    <!-- Static background that won't change during scroll -->
    <div class="static-background"></div>
    <header>
            <div class="container header">
                <img src="img/anti.png" class="logo">
                <nav class="header-nav">
                    <!-- Навигация -->
                    <a href="/forum" class="nav-a">
                        <svg
                            class="forum-icon"
                            width="35"
                            height="35"
                            viewBox="0 0 35 35"
                            fill="none"
                            xmlns="http://www.w3.org/2000/svg"
                        >
                            <path
                                d="M33.9048 35C33.7873 35.0005 33.6704 34.9813 33.5592 34.9431L28.4366 33.2347C26.4433 34.3918 24.1794 35.0009 21.8746 35C18.395 34.9965 15.0589 33.6126 12.5985 31.1519C10.138 28.6913 8.75423 25.3549 8.75075 21.875C8.75423 18.3951 10.138 15.0587 12.5985 12.5981C15.0589 10.1374 18.395 8.75351 21.8746 8.75003C25.3542 8.75351 28.6903 10.1374 31.1508 12.5981C33.6112 15.0587 34.995 18.3951 34.9985 21.875C34.9989 24.1799 34.3899 26.4439 33.2333 28.4375L34.9438 33.5672C35.0081 33.76 35.0174 33.967 34.9707 34.1648C34.9239 34.3626 34.823 34.5435 34.6791 34.6872C34.4726 34.8898 34.1942 35.0022 33.9048 35ZM21.8746 10.9375C18.9751 10.941 16.1954 12.0945 14.1451 14.1449C12.0949 16.1953 10.9415 18.9753 10.9381 21.875C10.9415 24.7747 12.0949 27.5547 14.1451 29.6051C16.1954 31.6555 18.9751 32.809 21.8746 32.8125C23.9417 32.8107 25.9656 32.2212 27.7104 31.1128C27.8475 31.0258 28.0023 30.9705 28.1634 30.9509C28.3246 30.9312 28.4881 30.9476 28.6422 30.999L32.1769 32.1759L30.9979 28.6431C30.9465 28.4891 30.93 28.3255 30.9497 28.1643C30.9694 28.0032 31.0247 27.8484 31.1116 27.7112C32.2202 25.9664 32.8096 23.9422 32.8112 21.875C32.8077 18.9753 31.6544 16.1953 29.6041 14.1449C27.5539 12.0945 24.7741 10.941 21.8746 10.9375ZM1.44076 28.3806L8.0027 26.1931C8.27794 26.1017 8.50562 25.9047 8.63565 25.6455C8.76568 25.3862 8.78741 25.0859 8.69607 24.8106C8.65061 24.6743 8.57872 24.5482 8.48452 24.4397C8.39031 24.3311 8.27564 24.2422 8.14705 24.178C8.01846 24.1138 7.87848 24.0756 7.73511 24.0655C7.59174 24.0555 7.44779 24.0738 7.3115 24.1194L2.82533 25.6134L4.50737 20.5625C4.56215 20.3963 4.57625 20.2193 4.54846 20.0465C4.52068 19.8737 4.45183 19.7101 4.34769 19.5694C2.78454 17.4753 2.02963 14.8873 2.22172 12.2812C2.4138 9.675 3.53996 7.22572 5.39323 5.38348C6.40682 4.36604 7.61208 3.55971 8.93929 3.01113C10.2665 2.46256 11.6893 2.18263 13.1254 2.18755C14.5619 2.18349 15.985 2.46445 17.3122 3.01416C18.6395 3.56387 19.8445 4.37141 20.8575 5.39004C21.0626 5.59508 21.3407 5.71027 21.6307 5.71027C21.9207 5.71027 22.1989 5.59508 22.404 5.39004C22.609 5.18493 22.7242 4.90678 22.7242 4.61676C22.7242 4.32674 22.609 4.04859 22.404 3.84348C21.1884 2.62103 19.7424 1.65189 18.1497 0.992157C16.557 0.332427 14.8493 -0.00478328 13.1254 5.12563e-05C11.4015 -0.00478328 9.69377 0.332427 8.10109 0.992157C6.5084 1.65189 5.0624 2.62103 3.8468 3.84348C1.69061 5.9835 0.351186 8.81064 0.0607455 11.8347C-0.229695 14.8589 0.547161 17.8893 2.25663 20.4006L0.0561897 26.9981C-0.00812609 27.191 -0.017432 27.3979 0.0293181 27.5957C0.0760682 27.7936 0.177025 27.9745 0.320855 28.1181C0.422607 28.2196 0.543366 28.3001 0.676227 28.3549C0.809089 28.4097 0.951446 28.4377 1.09516 28.4375C1.21273 28.438 1.32956 28.4188 1.44076 28.3806Z"
                            />
                        </svg>

                        Forum
                    </a>
                    <a href="/wiki" class="nav-a">
                        <svg
                            class="wiki-icon"
                            width="28"
                            height="31"
                            viewBox="0 0 28 31"
                            fill="none"
                            xmlns="http://www.w3.org/2000/svg"
                        >
                            <path
                                d="M1 26.7778V6.15556C1 4.35095 1 3.44863 1.35423 2.75937C1.66581 2.15306 2.163 1.66012 2.77453 1.35121C3.46974 1 4.37984 1 6.2 1H21.8C23.6202 1 24.5303 1 25.2255 1.35121C25.837 1.66012 26.3342 2.15306 26.6457 2.75937C27 3.44863 27 4.35095 27 6.15556V23.5556H4.25C2.45507 23.5556 1 24.9981 1 26.7778ZM1 26.7778C1 28.5574 2.45507 30 4.25 30H27M9.125 7.44444H18.875M9.125 13.8889H18.875M25.375 23.5556V30"
                            />
                        </svg>

                        Wiki
                    </a>
                    <button class="user-button">
                        <svg
                            class="user-icon"
                            width="39"
                            height="49"
                            viewBox="0 0 39 49"
                            fill="none"
                            xmlns="http://www.w3.org/2000/svg"
                        >
                            <path
                                d="M2 47C2 37.335 9.83503 29.5 19.5 29.5C29.165 29.5 37 37.335 37 47M29.5 12C29.5 17.5229 25.0228 22 19.5 22C13.9771 22 9.5 17.5229 9.5 12C9.5 6.47715 13.9771 2 19.5 2C25.0228 2 29.5 6.47715 29.5 12Z"
                            />
                        </svg>
                    </button>
                </nav>
            </div>
        </header>

        <div class="posts-container" id="postsContainer">
            <!-- Posts will be dynamically added here -->
        </div>
        
        <button class="load-more">Load More Posts</button>
    </div>

    <script>
    // Sample post data
    const samplePosts = [
        {          
            username: "Николай Алиев 🧠",
            title: "Айти в нынешние реали",
            content: "В мире ИТ всё меняется быстрее, чем ты успеваешь допить кофе. Сегодня ты — junior, завтра — DevOps-маг, а послезавтра уже учишь ИИ писать тебе резюме.\nГлавное — не гнаться за хайпом, а понять, зачем тебе всё это нужно. Не бойся спрашивать, ошибаться и начинать заново. Айти — это не про код. Это про мышление.\nА всё остальное — наживное."
        }
    ];
    const avatar = "img/efa09465403026c4241fd994e2030e24a0965b2c.png"
    // Image path constant
    const IMAGE_PLACEHOLDER = "img/1fc1ffa3a2be1edaf0b2d00b4ec08b9598227497.jpg" ;

    // Function to create a single post
    function createPost(post, index) {
        const postElement = document.createElement('div');
        postElement.className = 'post';
        
        // Add animation delay for staggered effect
        postElement.style.animationDelay = `${index * 0.1}s`;
        
        // Handle content with line breaks
        const formattedContent = post.content.replace(/\n/g, '<br>');
        const formattedTitle = post.title.replace(/\n/g, '<br>');
        
        postElement.innerHTML = `
            <img class="avatar" src=${avatar} alt=${post.username.charAt(0)}>
            <div class="post-header">
                <div class="user-info">
                    <h3>${post.username}</h3>
                </div>
            </div>
            <div class="post-content">
                ${formattedTitle}
            </div>
            <img class="post-image" src="${IMAGE_PLACEHOLDER}" alt="Post image">
            <div class="post-info">
                ${formattedContent}
            </div>
            <div class="post-footer">
                <div class="post-actions">
                    <button>
                        <svg width="46" height="47" viewBox="0 0 46 47" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M11.6273 18.9602V45.5284M11.6273 18.9602L1 18.9601V45.5284H11.6273M11.6273 18.9602L25.4311 2.85574C26.7409 1.32762 28.8016 0.67069 30.7543 1.15883L30.8805 1.19042C34.4455 2.08165 36.0512 6.23549 34.0132 9.29291L27.5683 18.9601H39.6845C43.0376 18.9601 45.5526 22.0277 44.895 25.3158L41.7068 41.2568C41.21 43.7407 39.0293 45.5284 36.4963 45.5284H11.6273" stroke="#4D79A8" stroke-width="1.06273" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </button>
                    <button>
                        <svg width="48" height="45" viewBox="0 0 48 45" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M23.5977 0.5C36.4331 0.5 46.703 9.40471 46.7031 20.2324C46.7031 31.0619 36.4332 39.9658 23.5977 39.9658C21.6675 39.9658 19.8004 39.7405 18.0029 39.3574L17.8105 39.3164L17.6416 39.418L10.4727 43.7266L10.5674 36.8037L10.5713 36.5156L10.3252 36.3682C4.36225 32.7828 0.493164 26.8817 0.493164 20.2324C0.49333 9.40479 10.7624 0.500142 23.5977 0.5Z" stroke="#4D79A8"/>
                        </svg>
                    </button>
                    <button>
                        <svg width="50" height="47" viewBox="0 0 50 47" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path fill-rule="evenodd" clip-rule="evenodd" d="M32.6599 41.0487L48.0407 24.1243C48.6479 23.473 49 22.498 49 21.4686C49 20.4392 48.6479 19.4647 48.0407 18.8129L32.6599 1.88867C31.8394 0.968048 30.6912 0.742314 29.7013 1.30726C28.7115 1.8722 28.0539 3.12883 28.0072 4.54436V11.2196C6.41379 6.30882 1 31.6773 1 46C6.00921 35.0892 18.99 15.311 28.0072 31.6773V38.3705C28.0477 39.7902 28.7029 41.0546 29.6938 41.6249C30.685 42.1952 31.837 41.9714 32.6599 41.0487Z" stroke="#4D79A8" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </button>
                </div>
            </div>
        `;
        
        return postElement;
    }

    // Function to render all posts
    function renderPosts() {
        const container = document.getElementById('postsContainer');
        container.innerHTML = '';
        
        samplePosts.forEach((post, index) => {
            const postElement = createPost(post, index);
            container.appendChild(postElement);
        });
    }

    // Function to load more posts
    function loadMorePosts() {
        const container = document.getElementById('postsContainer');
        
        // Add more sample posts for demonstration
        const additionalPosts = [
            {
                username: "David Martinez",
                content: "This implementation uses a fixed background to ensure visual stability during scrolling. The design maintains its integrity at all times.",
                title: "Modern Web Design Principles"
            },
            {
                username: "Lisa Thompson",
                content: "The combination of modern CSS features and clean JavaScript creates an engaging user experience that feels both professional and delightful.",
                title: "Building Engaging Interfaces"
            }
        ];
        
        additionalPosts.forEach((post, index) => {
            const postElement = createPost(post, samplePosts.length + index);
            container.appendChild(postElement);
        });
    }

    // Initialize the page
    document.addEventListener('DOMContentLoaded', function() {
        renderPosts();
        
        // Add event listener to load more button
        const loadMoreButton = document.querySelector('.load-more');
        if (loadMoreButton) {
            loadMoreButton.addEventListener('click', loadMorePosts);
        }
    });
    </script>


</body>
</html>
